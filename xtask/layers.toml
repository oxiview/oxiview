# Single source of truth for dependency direction; allowlists apply to normal / build / dev.
# The dev-only exception lets any checked crate use test tools in tests.
# Skip crates not yet created; new workspace members must be registered.
# Examples are applications, so they are exempt; the xtask ban still applies to them.
exempt = ["xtask", "window", "snake", "snake-oxi", "snake-m5-oxi", "markdown-editor-oxi", "log-viewer-oxi", "animation-fps"]
forbidden = ["xtask"]
dev-only = ["oxiview-testing"]

[crates.oxiview]
context = "facade"
role = "facade"
allow = ["oxiview-app", "oxiview-widgets", "oxiview-macros"]

[crates.oxiview-base]
context = "shared-foundation"
role = "foundation"
allow = []

[crates.oxiview-reactive]
context = "reactivity"
role = "context"
allow = ["oxiview-base"]

[crates.oxiview-scene]
context = "rendering"
role = "port"
allow = ["oxiview-base"]

[crates.oxiview-text]
context = "text"
role = "port"
allow = ["oxiview-base"]

[crates.oxiview-layout]
context = "layout"
role = "port"
allow = ["oxiview-base"]

[crates.oxiview-platform]
context = "platform"
role = "port"
allow = ["oxiview-base"]

[crates.oxiview-style]
context = "styling"
role = "port"
# Use scene only for color/geometry types; type boundaries still require code review.
allow = ["oxiview-base", "oxiview-scene"]

[crates.oxiview-render-cpu]
context = "rendering"
role = "adapter"
allow = ["oxiview-base", "oxiview-scene"]

[crates.oxiview-render-wgpu]
context = "rendering"
role = "adapter"
allow = ["oxiview-base", "oxiview-scene"]

[crates.oxiview-platform-macos]
context = "platform"
role = "adapter"
allow = ["oxiview-base", "oxiview-platform"]

[crates.oxiview-platform-headless]
context = "platform"
role = "adapter"
allow = ["oxiview-base", "oxiview-platform"]

[crates.oxiview-core]
context = "ui-core"
role = "context"
allow = ["oxiview-base", "oxiview-reactive", "oxiview-scene", "oxiview-text", "oxiview-layout", "oxiview-platform", "oxiview-style"]

[crates.oxiview-widgets]
context = "widgets"
role = "context"
allow = ["oxiview-base", "oxiview-reactive", "oxiview-scene", "oxiview-text", "oxiview-layout", "oxiview-platform", "oxiview-style", "oxiview-core"]

[crates.oxiview-app]
context = "application-composition"
role = "composition-root"
allow = ["oxiview-base", "oxiview-reactive", "oxiview-scene", "oxiview-text", "oxiview-layout", "oxiview-platform", "oxiview-style", "oxiview-core", "oxiview-render-cpu", "oxiview-render-wgpu", "oxiview-platform-macos", "oxiview-platform-headless"]

[crates.oxiview-macros]
context = "procedural-macros"
role = "tooling"
allow = ["oxiview-syntax"]

[crates.oxiview-syntax]
context = "language-tooling"
role = "tooling"
allow = []

[crates.oxiview-lsp]
context = "language-tooling"
role = "tooling"
allow = ["oxiview-syntax"]

[crates.oxiview-testing]
context = "testing"
role = "tooling"
allow = ["oxiview-base", "oxiview-scene"]

[[external]]
packages = ["kurbo", "peniko"]
allow = ["oxiview-base"]

[[external]]
packages = ["objc2", "objc2-foundation", "objc2-metal", "objc2-quartz-core", "block2"]
allow = ["oxiview-platform-macos", "oxiview-render-wgpu"]

[[external]]
packages = ["objc2-*"]
except = ["objc2-foundation", "objc2-metal", "objc2-quartz-core"]
allow = ["oxiview-platform-macos"]

[[external]]
packages = ["taffy"]
allow = ["oxiview-layout"]

[[external]]
packages = ["parley", "fontique", "swash", "harfrust", "icu_segmenter"]
allow = ["oxiview-text"]

[[external]]
packages = ["skrifa"]
allow = ["oxiview-text", "oxiview-render-cpu", "oxiview-render-wgpu"]

[[external]]
packages = ["glifo"]
allow = ["oxiview-render-wgpu"]

[[external]]
packages = ["vello", "vello_gpu", "wgpu"]
allow = ["oxiview-render-wgpu", "oxiview-app"]

[[external]]
packages = ["fearless_simd", "vello_cpu"]
allow = ["oxiview-render-cpu"]

[[external]]
packages = ["notify", "notify-types"]
allow = ["oxiview-app"]

