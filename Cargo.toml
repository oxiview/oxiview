[workspace]
resolver = "3"
# Cargo 拒绝没有匹配项的成员通配符；首个框架 crate 创建时加入 "crates/*"。
members = ["xtask"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
version = "0.0.0"
publish = false

[workspace.dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = { version = "1.2.1", default-features = false, features = ["std", "serde", "parse"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
# 选择 pedantic 的无损转换检查；另启用冗余克隆和调试宏检查，避免整体开启的噪声。
cast_lossless = "warn"
redundant_clone = "warn"
dbg_macro = "warn"
