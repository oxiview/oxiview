[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
version = "0.0.0"
publish = false

[workspace.dependencies]
divan = "=0.1.21"
png = "0.18.1"
thiserror = "2.0.21"
oxiview-testing = { path = "crates/oxiview-testing" }
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = { version = "1.2.1", default-features = false, features = ["std", "serde", "parse"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
# Enable the pedantic lossless-cast check plus redundant-clone and debug-macro checks, avoiding blanket pedantic noise.
cast_lossless = "warn"
redundant_clone = "warn"
dbg_macro = "warn"
