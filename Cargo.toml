[workspace]
resolver = "3"
members = ["crates/*", "examples/*", "xtask"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
version = "0.0.0"
publish = false

[workspace.dependencies]
oxiview-syntax = { version = "0.0.0", path = "crates/oxiview-syntax" }
lsp-server = "=0.10.0"
url = "=2.5.8"
snake = { version = "0.0.0", path = "examples/snake" }
oxiview-reactive = { version = "0.0.0", path = "crates/oxiview-reactive" }
oxiview-macros = { version = "0.0.0", path = "crates/oxiview-macros" }
oxiview-text = { version = "0.0.0", path = "crates/oxiview-text" }
proc-macro2 = "=1.0.107"
quote = "=1.0.47"
syn = { version = "=2.0.119", features = ["full", "parsing"] }
parley = { version = "=0.13.0", default-features = false, features = ["system", "complex-scripts"] }
swash = { version = "=0.2.10", default-features = false, features = ["std", "scale", "render"] }
skrifa = { version = "=0.49.0", default-features = false, features = ["std"] }
taffy = { version = "=0.15.1", default-features = false, features = ["std", "flexbox", "grid", "block_layout", "content_size"] }
oxiview-style = { version = "0.0.0", path = "crates/oxiview-style" }
oxiview-layout = { version = "0.0.0", path = "crates/oxiview-layout" }
block2 = "=0.6.2"
objc2-metal = { version = "=0.3.2", default-features = false, features = ["std", "MTLDrawable", "block2", "objc2-core-foundation"] }
libc = "=0.2.191"
oxiview-app = { version = "0.0.0", path = "crates/oxiview-app" }
oxiview-core = { version = "0.0.0", path = "crates/oxiview-core" }
oxiview-platform-headless = { version = "0.0.0", path = "crates/oxiview-platform-headless" }
oxiview-platform = { version = "0.0.0", path = "crates/oxiview-platform" }
oxiview-platform-macos = { version = "0.0.0", path = "crates/oxiview-platform-macos" }
oxiview-render-cpu = { version = "0.0.0", path = "crates/oxiview-render-cpu" }
objc2-quartz-core = { version = "=0.3.2", default-features = false, features = ["std", "CALayer", "CAMetalLayer", "CADisplayLink", "CATransaction", "objc2-core-foundation"] }
oxiview-render-wgpu = { version = "0.0.0", path = "crates/oxiview-render-wgpu" }
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSObject", "NSString", "NSGeometry", "NSRunLoop"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSRunningApplication", "NSResponder", "NSScreen", "NSWindow", "NSView", "NSTrackingArea", "NSEvent", "NSGraphics", "NSGraphicsContext", "objc2-core-foundation", "objc2-quartz-core"] }
wgpu = { version = "=30.0.2", default-features = false, features = ["std", "metal", "vulkan", "dx12", "wgsl"] }
vello_gpu = { version = "=0.4.0", default-features = false, features = ["wgpu", "text", "full_image_support", "gradient_sweep"] }
glifo = { version = "=0.5.0", default-features = false, features = ["std"] }
guillotiere = "=0.7.0"
half = { version = "=2.7.1", default-features = false }
oxiview-scene = { version = "0.0.0", path = "crates/oxiview-scene" }
fearless_simd = { version = "=1.2.0", default-features = false }
vello_cpu = { version = "=0.4.0", default-features = false, features = ["std", "u8_pipeline", "f32_pipeline"] }
oxiview-base = { version = "0.0.0", path = "crates/oxiview-base" }
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
kurbo = "=0.13.1"
peniko = "=0.6.1"
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
divan = "=0.1.21"
png = "0.18.1"
thiserror = "2.0.21"
oxiview-testing = { path = "crates/oxiview-testing" }
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = { version = "1.2.1", default-features = false, features = ["std", "serde", "parse"] }
notify = { version = "=8.2.2", default-features = false, features = ["macos_fsevent"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
# Enable the pedantic lossless-cast check plus redundant-clone and debug-macro checks, avoiding blanket pedantic noise.
cast_lossless = "warn"
redundant_clone = "warn"
dbg_macro = "warn"

[patch.crates-io]
# Published Vello CPU 0.4.0, upstream b7e8f523b45c07a5edb806bb7241ef5afe34a882.
# The local patch samples Scene images and writes straight sRGB at the float compositor's boundaries.
vello_cpu = { path = "vendor/vello_cpu" }
