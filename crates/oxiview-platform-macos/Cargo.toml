[package]
name = "oxiview-platform-macos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
diagnostics = ["dep:libc", "objc2-foundation/NSDate", "objc2-foundation/NSTimer"]

[[example]]
name = "m5_input_probe"
required-features = ["diagnostics"]

[[example]]
name = "m6_input_probe"
required-features = ["diagnostics"]

[dependencies]
oxiview-platform.workspace = true
oxiview-base.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc = { workspace = true, optional = true }
block2.workspace = true
objc2-metal.workspace = true
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["NSAttributedString", "NSNotification", "NSOperation", "NSURL", "block2"] }
objc2-app-kit = { workspace = true, features = ["NSAccessibility", "NSAppearance", "NSColor", "NSColorSpace", "NSOpenPanel", "NSPanel", "NSPasteboard", "NSPasteboardItem", "NSSavePanel", "NSTextInputClient", "NSTextInputContext", "NSWorkspace", "block2"] }
objc2-quartz-core = { workspace = true, features = ["CAMetalDisplayLink", "objc2-metal"] }
