[package]
name = "oxiview-render-wgpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
oxiview-base.workspace = true
oxiview-scene.workspace = true
thiserror.workspace = true
wgpu.workspace = true
vello_gpu.workspace = true
glifo.workspace = true
skrifa.workspace = true
guillotiere.workspace = true
half.workspace = true
tracing.workspace = true

[dev-dependencies]
divan.workspace = true

[[bench]]
name = "render"
path = "../../benches/render.rs"
harness = false

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation.workspace = true
block2.workspace = true
objc2-metal = { workspace = true, features = ["MTLCommandBuffer", "MTLCommandEncoder", "MTLCommandQueue", "MTLDevice", "MTLLibrary", "MTLPixelFormat", "MTLRenderCommandEncoder", "MTLRenderPass", "MTLRenderPipeline", "MTLResource", "MTLTexture"] }
objc2-quartz-core = { workspace = true, features = ["objc2-metal"] }
